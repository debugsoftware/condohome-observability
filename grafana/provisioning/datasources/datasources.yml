# Grafana datasources — CondoHome piloto
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "30s"
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        # Correlation: se logs tiverem trace_id / correlation_id
        - name: TraceID
          matcherRegex: "trace_id[=:]\\s*([a-fA-F0-9]+)"
          url: ""
          datasourceUid: ""
        - name: CorrelationId
          matcherRegex: "correlation_id[=:]\\s*([\\w-]+)"
          url: ""
